<!DOCTYPE html>
<html>
<head>
    <title>AWS Lambda Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            padding: 50px;
            text-align: center;
        }
        input, select, button {
            padding: 10px;
            margin: 10px;
            font-size: 16px;
        }
        #result {
            margin-top: 20px;
            font-size: 22px;
            color: green;
        }
    </style>
</head>
<body>
    <h1>AWS Lambda Calculator</h1>

    <input type="number" id="num1" placeholder="Enter first number">
    <select id="operation">
        <option value="add">+</option>
        <option value="subtract">-</option>
        <option value="multiply">×</option>
        <option value="divide">÷</option>
    </select>
    <input type="number" id="num2" placeholder="Enter second number">

    <br>
    <button onclick="calculate()">Calculate</button>

    <div id="result"></div>

    <script>
        function calculate() {
            const num1 = document.getElementById("num1").value;
            const num2 = document.getElementById("num2").value;
            const operation = document.getElementById("operation").value;

            if (num1 === "" || num2 === "") {
                document.getElementById("result").innerHTML = "Please enter both numbers.";
                return;
            }

            const apiUrl = "https://9nni27jwf0.execute-api.us-east-1.amazonaws.com/default/calc"
                            + "?num1=" + num1
                            + "&num2=" + num2
                            + "&operation=" + operation;

            fetch(apiUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Network response was not ok");
                    }
                    return response.text();
                })
                .then(data => {
                    document.getElementById("result").innerHTML = "Result: " + data;
                })
                .catch(error => {
                    console.error("Error:", error);
                    document.getElementById("result").innerHTML = "An error occurred. Check console.";
                });
        }
    </script>
</body>
</html>
