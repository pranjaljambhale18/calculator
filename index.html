<!DOCTYPE html>
<html>
<head>
    <title>AWS Lambda Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
        }
        input, select, button {
            padding: 10px;
            margin: 8px;
            font-size: 16px;
        }
        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Simple Calculator (AWS Lambda + API Gateway)</h1>

    <input type="number" id="num1" placeholder="Enter number 1">
    <input type="number" id="num2" placeholder="Enter number 2">

    <select id="operation">
        <option value="add">+</option>
        <option value="subtract">-</option>
        <option value="multiply">*</option>
        <option value="divide">/</option>
    </select>

    <button onclick="calculate()">Calculate</button>

    <div id="result"></div>

    <script>
        function calculate() {
            const num1 = document.getElementById("num1").value;
            const num2 = document.getElementById("num2").value;
            const operation = document.getElementById("operation").value;

            if (num1 === "" || num2 === "") {
                document.getElementById("result").innerHTML = "Please enter both numbers.";
                return;
            }

            const url = `https://9nni27jwf0.execute-api.us-east-1.amazonaws.com/default/calc?num1=${num1}&num2=${num2}&operation=${operation}`;

            fetch(url)
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => { throw new Error(text); });
                }
                return response.text();
            })
            .then(data => {
                document.getElementById("result").innerHTML = data;
            })
            .catch(error => {
                document.getElementById("result").innerHTML = error.message;
                console.error('Error:', error);
            });
        }
    </script>

</body>
</html>
